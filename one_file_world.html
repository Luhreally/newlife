
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Seeded Origin World</title>
<link rel="stylesheet" href="./styles/legacy-app.css" />
</head>
<body>
<div id="app">
  <div id="toolbar">
    <div class="group">
      <label>Seed <input type="text" id="seedInput" value="woven-ember-4701" spellcheck="false"></label>
      <button id="newSeedBtn">New Seed</button>
    </div>
    <div class="group">
      <button id="slowerBtn">Slower</button>
      <button id="pauseBtn">Pause</button>
      <button id="fasterBtn">Faster</button>
      <button id="speedBtn">1x</button>
      <button id="turboBtn">Turbo Off</button>
      <button id="forecast60Btn">Estimate +60s</button>
      <button id="forecast180Btn">Estimate +180s</button>
      <button id="commitForecastBtn">Fast-Forward +60s</button>
      <button id="zoomOutBtn">-</button>
      <button id="zoomInBtn">+</button>
      <button id="fitBtn">Fit</button>
    </div>
    <div class="group">
      <button id="bloomBtn">Bloom Pulse</button>
      <button id="shelterBtn">Shelter Pulse</button>
    </div>
    <div class="group">
      <button id="saveBtn">Save JSON</button>
      <button id="loadBtn">Load JSON</button>
      <input type="file" id="loadInput" accept="application/json" hidden>
    </div>
    <div class="group">
      <label>Timeline <input type="range" id="timeline" min="0" max="0" value="0"></label>
      <span id="timelineLabel" class="mono">live</span>
    </div>
    <div class="group checks">
      <label><input type="checkbox" id="ovInfluence"> camp influence</label>
      <label><input type="checkbox" id="ovRoutes" checked> routes</label>
      <label><input type="checkbox" id="ovRegional"> regional activity</label>
      <label><input type="checkbox" id="ovMaterial"> material distribution</label>
      <label><input type="checkbox" id="ovCulture"> lineage / culture</label>
      <label><input type="checkbox" id="ovProto" checked> proto-life</label>
      <label><input type="checkbox" id="ovEvents" checked> recent events</label>
    </div>
  </div>
  <div id="main">
    <div id="viewport">
      <canvas id="worldCanvas"></canvas>
      <div id="overlayHud">
        <div class="hudCard">
          <div class="hudTitle">World</div>
          <div class="hudValue" id="hudWorld"></div>
        </div>
        <div class="hudCard">
          <div class="hudTitle">View</div>
          <div class="hudValue" id="hudView"></div>
        </div>
      </div>
      <div id="footerHint">drag to pan - wheel to zoom - click creatures, blocks, deposits, or camps - focused camps ghost their front roofs when zoomed in - bloom/shelter pulses nudge the viewed area</div>
    </div>
    <aside id="inspector">
      <div class="panel" id="worldPanel"></div>
      <div class="panel" id="selectionPanel"></div>
      <div class="panel" id="historyPanel"></div>
    </aside>
  </div>
</div>

<script src="./src/legacy-app.js"></script>
</body>
</html>
