<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Seeded Origin World</title>
<style>
  :root {
    color-scheme: dark;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    min-height: 100%;
    background: #06080b;
    color: #d9e7f2;
    font: 14px/1.4 Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  }

  body {
    display: grid;
    place-items: center;
  }

  .bootShell {
    width: min(92vw, 34rem);
    padding: 1rem 1.1rem;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 14px;
    background: linear-gradient(180deg, rgba(20, 28, 36, 0.96), rgba(12, 16, 22, 0.96));
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28);
  }

  .bootTitle {
    margin: 0 0 0.4rem;
    font-size: 1rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #93a6b8;
  }

  .bootBody {
    margin: 0;
  }

  .bootError {
    border-color: rgba(255, 143, 124, 0.35);
    background: linear-gradient(180deg, rgba(50, 20, 20, 0.9), rgba(28, 10, 10, 0.96));
  }

  .bootError code {
    word-break: break-word;
  }
</style>
</head>
<body>
  <div id="bootShell" class="bootShell" role="status" aria-live="polite">
    <p class="bootTitle">Boot</p>
    <p id="bootMessage" class="bootBody">Loading legacy world into the new static entrypoint...</p>
  </div>
  <script type="module" src="./src/bootstrap.js"></script>
</body>
</html>
